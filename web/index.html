<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JAGUAR</title>
<style>
  body { margin: 0; font: 13px sans-serif; display: grid; grid-template-columns: 430px 1fr; grid-template-rows: 60vh 40vh; height: 100vh; }
  #left { grid-row: 1 / 3; padding: 8px; overflow: auto; border-right: 1px solid #ccc; }
  #toml { width: 100%; height: 40vh; font: 12px monospace; }
  #view { position: relative; }
  #plotwrap { border-top: 1px solid #ccc; display: flex; flex-direction: column; min-height: 0; }
  #plotctl { font-size: 12px; padding: 2px 6px; min-height: 20px; }
  #plot { width: 100%; flex: 1; min-height: 0; display: block; }
  #tabs { display: flex; border-top: 1px solid #ccc; background: #eee; }
  #tabs button { border: 0; border-right: 1px solid #ccc; background: none; padding: 4px 10px; cursor: pointer; font: 12px sans-serif; }
  #tabs button.on { background: #fff; font-weight: bold; box-shadow: inset 0 2px #36c; }
  progress { width: 100%; }
  .ok { color: #080; font-weight: bold; } .bad { color: #c00; font-weight: bold; } .warn { color: #b60; }
  #err { color: #c00; white-space: pre-wrap; }
  table td { padding: 1px 6px; }
  fieldset { margin: 6px 0; padding: 4px 6px; } legend { font-weight: bold; }
  .row { display: flex; align-items: center; gap: 4px; margin: 2px 0; }
  .row label { width: 150px; } .row input[type=number] { width: 70px; } .row select { flex: 1; }
  .unit { color: #666; width: 30px; } .q { color: #36c; cursor: help; font-size: 11px; }
  .lc { border: 1px dashed #bbb; padding: 3px; margin: 3px 0; } .lc input { width: 160px; }
  .tri input { width: 58px !important; } .bar { display: inline-block; height: 8px; background: #48c; vertical-align: middle; }
  details { margin: 6px 0; } #gen { width: 100%; height: 30vh; font: 11px monospace; }
  #checks td { white-space: nowrap; } .gov { font-weight: bold; }
  .hint { color: #888; font-size: 11px; } #mix table td, #winner table td { padding: 0 4px; }
  #viewlabel { position: absolute; left: 8px; top: 6px; background: #fffc; padding: 2px 6px; font-weight: bold; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="left">
  <h3 style="margin:4px 0">JAGUAR: lightest wall that does not crack</h3>
  <form id="form" onsubmit="return false"></form>
  <details id="raw"><summary>Advanced: edit raw TOML (when open, this text is submitted instead of the form)</summary>
    <textarea id="toml" spellcheck="false"></textarea></details>
  <button id="run">Run optimization</button>
  <div id="err"></div>
  <details id="gendet"><summary>Generated canoe.toml</summary>
    <button id="copy" type="button">Copy</button><br><textarea id="gen" readonly></textarea></details>
  <div id="status">idle</div>
  <progress id="prog" value="0" max="1"></progress>
  <h4>Mix data</h4>
  <div id="mix">loading...</div>
  <h4>Winner</h4>
  <div id="winner">no result yet</div>
</div>
<div id="view"><div id="viewlabel"></div></div>
<div id="plotwrap"><div id="plotctl"></div><canvas id="plot"></canvas><div id="tabs"></div></div>
<script>
const $ = id => document.getElementById(id);
let fbGate = null, hull = null, cands = [], result = null, polling = false, dcGate = 1.0, searchDepthMax = 14, gmGate = null, objKind = 'weight', hullLabel = '';

function parseTomlBits(text) {
  // Just enough to read gates.dc_search and search.depth_in max for drawing.
  let sec = '';
  for (const line of text.split('\n')) {
    const l = line.replace(/#.*/, '').trim();
    const m = l.match(/^\[([^\]]+)\]$/); if (m) { sec = m[1]; continue; }
    const kv = l.match(/^(\w+)\s*=\s*(.+)$/); if (!kv) continue;
    if (sec === 'gates' && kv[1] === 'dc_search') dcGate = parseFloat(kv[2]);
    if (sec === 'gates' && kv[1] === 'freeboard_min_in') fbGate = parseFloat(kv[2]);
    if (sec === 'stability' && kv[1] === 'gm_min_in') gmGate = parseFloat(kv[2]);
    if (sec === 'objective' && kv[1] === 'kind') objKind = kv[2].replace(/"/g, '').trim();
    if (sec === 'search' && kv[1] === 'depth_in') { try { searchDepthMax = JSON.parse(kv[2])[1]; } catch (e) {} }
  }
}


// ---------- form ----------
// [section, key, label, unit, tooltip, step, min]
const FIELDS = {
  hull: [['flare_deg', 'Side flare', 'deg', 'How much the hull sides lean outward above the design waterline, in degrees from vertical. 0 = straight up. Typical canoes use 5-15. More flare = wider gunwale (more stable, more freeboard) but more concrete.', 'any', 0],
    ['stations', 'Stations', '-', 'How many slices along the length the search checks. More is slower but finer. The winner is re-checked at 2n-1 stations. At least 11.', 1, 11]],
  material: [
    ['flex_over_split', 'Flex / split ratio', '-', 'Bending (flexural) strength divided by the split-cylinder tensile strength the lab measured. 1.0 is the safe choice; textbook relations give about 1.12.', 'any', 0],
    ['density_extrapolation_pcf', 'Density extrapolation', 'pcf', 'How far beyond the lightest and heaviest tested mixes the search may go. The strength line is fitted through only a few lab points, so far outside them it is a guess.', 'any', 0],
    ['factor_of_safety', 'Factor of safety', '-', 'Strength is divided by this. Must be at least 1.', 'any', 1],
    ['dynamic_load_factor', 'Dynamic load factor', '-', 'Multiplier on crew weight to cover paddling impact.', 'any', 0],
    ['knee_patch_in', 'Knee patch length', 'in', 'Length of the knee contact patch. Never zero: a point load makes D/C stop converging.', 'any', 0]],
  stability: [
    ['crew_cg_in', 'Crew CG height', 'in', 'Height of the paddlers\' centre of gravity above the keel. Kneeling paddlers are about 12 in (an assumption, not a measurement). Higher = tippier.', 'any', 0],
    ['gm_min_in', 'Min GM', 'in', 'Minimum metacentric height (how strongly the loaded canoe rights itself when tilted). Above 0 = it will not tip over at rest. Without this a shape search would make the hull as narrow as possible.', 'any']],
  objective: [
    ['speed_mps', 'Race speed', 'm/s', 'Speed at which water resistance is computed for the drag objective. A 2-person sprint is about 2.5 m/s.', 'any', 0]],
  search: [
    ['thickness_in', 'Wall thickness', 'in', 'Wall thickness range to search: min, max, step (inclusive).'],
    ['density_pcf', 'Mix density', 'pcf', 'Concrete density range to search: min, max, step (inclusive). Denser is stronger but heavier.'],
    ['depth_in', 'Mold depth', 'in', 'Gunwale height (hull depth) range to search: min, max, step (inclusive). Deeper is stiffer and has more freeboard.']],
  gates: [
    ['dc_search', 'D/C gate (search)', '-', 'Demand/capacity a candidate must stay under on the search grid. Must be <= the verify gate.', 'any', 0],
    ['dc_verify', 'D/C gate (verify)', '-', 'D/C the winner must stay under when re-run at 2n-1 stations. At most 1.0.', 'any', 0],
    ['freeboard_min_in', 'Min freeboard', 'in', 'Minimum loaded freeboard (gunwale above water) at the worst station.', 'any', 0],
    ['thickness_min_buildable_in', 'Thinnest buildable wall', 'in', 'Thinnest wall the team can actually cast. Thinner candidates are never generated.', 'any', 0]],
};
// Shape search bounds: [key, label, unit, tooltip, default [min, max]]. Meanings from hullgen.rs ShapeParams.
const SHAPE = [
  ['length_in', 'Length', 'in', 'Overall hull length. Longer = faster and stiffer to paddle straight, but heavier.', [216, 264]],
  ['beam_in', 'Beam', 'in', 'Maximum width at the design waterline. Wider = more stable, more drag.', [18, 30]],
  ['draft_in', 'Design draft', 'in', 'Depth of the design waterline of the generated hull table (not the mold depth).', [4, 8]],
  ['fore_wp', 'Bow waterplane', '-', 'Bow waterline shape exponent. Larger = finer, more hollow bow; 0 = full width all the way to the stem (blunt).', [0.3, 1.6]],
  ['section', 'Section shape', '-', 'Cross-section exponent. Small (~0.1) = boxy, near-vertical sides and a flat bottom; 0.5 = rounded (elliptic); 1 = V-ish.', [0.2, 0.8]],
  ['fore_rocker', 'Bow rocker', '-', 'Bow rocker exponent. Larger = keel rises sooner toward the bow (turns easier, tracks worse).', [0, 0.6]],
  ['aft_wp', 'Stern waterplane', '-', 'Stern waterline shape exponent, like the bow one: larger = finer stern, 0 = blunt.', [0.3, 1.6]],
  ['aft_rocker', 'Stern rocker', '-', 'Stern rocker exponent, like the bow one: larger = keel rises sooner toward the stern.', [0, 0.6]],
  ['fore_len_frac', 'Bow taper length', 'frac', 'Fraction of the length over which the bow tapers (0..1). If bow + stern exceed 1 both are scaled down (no straight middle section).', [0.3, 0.5]],
  ['aft_len_frac', 'Stern taper length', 'frac', 'Fraction of the length over which the stern tapers (0..1).', [0.3, 0.5]],
];
const SHAPE_INT = [
  ['samples', 'Samples', 'Number of random-but-repeatable shapes tried first (each one runs a full wall search). More = better coverage, slower.', 96],
  ['refine_rounds', 'Refine rounds', 'Rounds of local tweaking around the best shapes found.', 6],
  ['seed', 'Seed', 'Random seed. Same seed = same shapes = same result.', 1],
];
const PUNCH = [
  ['knee_split', 'Knee split', '-', 'With 2 knees: share of the paddler\'s weight on the heavier knee. 0.5 = even, 1 = all on one.', 'any', 0.5],
  ['knee_spacing_in', 'Knee spacing', 'in', 'Distance between the centres of the two knees. If the knees are close, their punching zones overlap and are checked together.', 'any', 0],
  ['pad_in', 'Knee pad', 'in', 'Thickness of the knee pad. A pad spreads the load over a bigger area (rules allow at most 0.5 in).', 'any', 0],
  ['d_over_t', 'Mesh depth / wall', '-', 'How deep the reinforcing mesh sits, as a fraction of wall thickness (aci_22_6 only). 0.5 = mesh in the middle of the wall.', 'any', 0]];
const SECTIONS = { punching: 'Punching (knee through the bottom)', hull: 'Hull', crew: 'Crew (load cases: the design must pass all of them)', material: 'Material', search: 'Search ranges (min / max / step)', gates: 'Gates', stability: 'Stability', objective: 'Objective', shape: 'Shape search (min / max; equal = fixed)' };
const ftin = x => { const t = Math.round(x); return `${Math.floor(t / 12)}' ${t % 12}"`; };
const tip = t => `<span class="q" title="${t}">(?)</span>`;
const esc = t => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
function numRow(sec, f) {
  const [k, label, unit, t, step, min] = f;
  return `<div class="row"><label title="${t}" for="${sec}.${k}">${label} ${tip(t)}</label>
    <input type="number" id="${sec}.${k}" title="${t}" step="${step}" ${min !== undefined ? `min="${min}"` : ''} required><span class="unit">${unit}</span></div>`;
}
function triRow(f) {
  const [k, label, unit, t] = f;
  const i = n => `<input type="number" id="search.${k}.${n}" title="${t} (${['min', 'max', 'step'][n]})" step="any" min="0" placeholder="${['min', 'max', 'step'][n]}">`;
  return `<div class="row tri"><label title="${t}">${label} ${tip(t)}</label>${i(0)}${i(1)}${i(2)}<span class="unit">${unit}</span></div>`;
}
function lcBlock(lc) {
  const d = document.createElement('div'); d.className = 'lc';
  const tw = 'Paddler weights in lb, bow to stern, comma separated.';
  const ts = 'Optional knee positions in inches from the bow, one per paddler, comma separated. Leave empty to space paddlers evenly.';
  d.innerHTML = `<div class="row"><label title="Name of this crew arrangement.">Name ${tip('Name of this crew arrangement.')}</label><input class="lcname" title="Name of this crew arrangement." value="${esc(lc.name || '')}"></div>
    <div class="row"><label title="${tw}">Weights ${tip(tw)}</label><input class="lcw" title="${tw}" value="${(lc.weights_lb || []).join(', ')}"><span class="unit">lb</span></div>
    <div class="row"><label title="${ts}">Seats (optional) ${tip(ts)}</label><input class="lcs" title="${ts}" value="${(lc.seats_in || []).join(', ')}"><span class="unit">in</span></div>
    <button type="button">Remove case</button>`;
  d.querySelector('button').onclick = () => d.remove();
  $('cases').appendChild(d);
}
function buildForm() {
  const ht = 'Which hull shape (jaguar-hull/1 JSON next to the canoe.toml) to optimize.';
  const st = 'Let JAGUAR design the hull shape too (length, beam, bow/stern shape...) within the bounds below, instead of using a fixed hull file.';
  const mt = 'Lab test results (CSV, path relative to the canoe.toml). Strength vs density is fitted from these breaks; every strength the checks use comes from that fit.';
  const ot = 'What best means among designs that pass every check: weight = lightest hull, drag = least water resistance at the race speed (only matters with shape search).';
  const smt = 'fit: strength from a straight line through all your lab breaks, so the search may pick any density in the trusted range. tested_mixes: only the mixes you actually tested can be picked, each with its own measured strength.';
  const pmt = 'Which ACI rule checks a knee punching through the hull bottom. aci_22_6 = reinforced slab (mesh in the wall). plain_14_5 = plain (unreinforced) concrete, more conservative.';
  const pkt = 'How many knees carry one paddler\'s weight. 1 = all on one knee (safe). 2 = kneeling on both knees (realistic), split by the knee split below.';
  const pair = ([k, label, unit, t]) => {
    const i = n => `<input type="number" id="shape.${k}.${n}" title="${t} (${['min', 'max'][n]})" step="any" min="0" placeholder="${['min', 'max'][n]}">`;
    return `<div class="row tri"><label title="${t}">${label} ${tip(t)}</label>${i(0)}${i(1)}<span class="unit">${unit}</span><span class="hint" id="shape.${k}.hint"></span></div>`;
  };
  const intRow = ([k, label, t]) => `<div class="row"><label title="${t}" for="shape.${k}">${label} ${tip(t)}</label><input type="number" id="shape.${k}" title="${t}" step="1" min="${k === 'samples' ? 1 : 0}"></div>`;
  $('form').innerHTML = `
    <fieldset><legend>${SECTIONS.hull}</legend>
      <div class="row"><label title="${st}" for="shapemode">Optimize hull shape ${tip(st)}</label><input type="checkbox" id="shapemode" title="${st}"></div>
      <div class="row" id="hullpick"><label title="${ht}">Hull file ${tip(ht)}</label><select id="hull.file" title="${ht}"></select></div>
      ${FIELDS.hull.map(f => numRow('hull', f)).join('')}</fieldset>
    <fieldset id="shapefs" style="display:none"><legend>${SECTIONS.shape}</legend>${SHAPE.map(pair).join('')}${SHAPE_INT.map(intRow).join('')}</fieldset>
    <fieldset><legend>${SECTIONS.crew}</legend><div id="cases"></div><button type="button" id="addcase">Add load case</button></fieldset>
    <fieldset><legend>${SECTIONS.material}</legend>
      <div class="row"><label title="${mt}" for="material.mix_data">Mix data file ${tip(mt)}</label><input id="material.mix_data" title="${mt}" style="flex:1"></div>
      <div class="row"><label title="${smt}" for="material.strength_model">Strength model ${tip(smt)}</label><select id="material.strength_model" title="${smt}"><option value="fit">fit (any density on the lab line)</option><option value="tested_mixes">tested_mixes (only mixes you tested)</option></select></div>
      ${FIELDS.material.map(f => numRow('material', f)).join('')}</fieldset>
    <fieldset><legend>${SECTIONS.punching}</legend>
      <div class="row"><label title="${pmt}" for="punching.method">Method ${tip(pmt)}</label><select id="punching.method" title="${pmt}"><option value="aci_22_6">aci_22_6 (reinforced slab)</option><option value="plain_14_5">plain_14_5 (plain concrete)</option></select></div>
      <div class="row"><label title="${pkt}" for="punching.knees">Knees per paddler ${tip(pkt)}</label><select id="punching.knees" title="${pkt}"><option value="1">1 (all weight on one knee)</option><option value="2">2 (weight shared)</option></select></div>
      ${PUNCH.map(f => numRow('punching', f)).join('')}</fieldset>
    <fieldset><legend>${SECTIONS.search}</legend>${FIELDS.search.map(triRow).join('')}</fieldset>
    <fieldset><legend>${SECTIONS.gates}</legend>${FIELDS.gates.map(f => numRow('gates', f)).join('')}</fieldset>
    <fieldset><legend>${SECTIONS.stability}</legend>${FIELDS.stability.map(f => numRow('stability', f)).join('')}</fieldset>
    <fieldset><legend>${SECTIONS.objective}</legend>
      <div class="row"><label title="${ot}" for="objective.kind">Optimize for ${tip(ot)}</label><select id="objective.kind" title="${ot}"><option value="weight">weight (lightest hull)</option><option value="drag">drag (least resistance)</option></select></div>
      ${FIELDS.objective.map(f => numRow('objective', f)).join('')}</fieldset>`;
  $('addcase').onclick = () => lcBlock({ name: 'case' + ($('cases').children.length + 1), weights_lb: [] });
  $('hull.file').onchange = () => loadHull($('hull.file').value);
  $('shapemode').onchange = setShapeMode;
  for (const k of ['length_in', 'beam_in', 'draft_in']) for (const n of [0, 1]) $(`shape.${k}.${n}`).oninput = shapeHints;
}
function setShapeMode() {
  const on = $('shapemode').checked;
  $('hullpick').style.display = on ? 'none' : '';
  $('shapefs').style.display = on ? '' : 'none';
}
function shapeHints() {
  for (const k of ['length_in', 'beam_in', 'draft_in']) {
    const v = [0, 1].map(n => Number($(`shape.${k}.${n}`).value));
    $(`shape.${k}.hint`).textContent = v.every(isFinite) ? `${ftin(v[0])} .. ${ftin(v[1])}` : '';
  }
}
function fillForm(p, hulls) {
  const sel = $('hull.file');
  sel.innerHTML = hulls.map(h => `<option value="${esc(h.file)}" title="${esc(h.notes || '')}">${esc(h.name)}: ${(h.length / 12).toFixed(1)} ft (${esc(h.file)})</option>`).join('');
  if (p.hull.file && !hulls.some(h => h.file === p.hull.file)) sel.insertAdjacentHTML('afterbegin', `<option value="${esc(p.hull.file)}">${esc(p.hull.file)}</option>`);
  if (p.hull.file) sel.value = p.hull.file;
  $('material.mix_data').value = p.material.mix_data;
  $('objective.kind').value = p.objective.kind;
  $('material.strength_model').value = p.material.strength_model || 'fit';
  const pu = p.punching || { method: 'aci_22_6', knees: 1, knee_split: 0.5, knee_spacing_in: 8, pad_in: 0, d_over_t: 0.5 };
  $('punching.method').value = pu.method; $('punching.knees').value = String(pu.knees);
  for (const [k] of PUNCH) $(`punching.${k}`).value = pu[k];
  if (p.hull.flare_deg === undefined) p.hull.flare_deg = 0;
  const ss = p.shape_search;
  for (const [k, , , , d] of SHAPE) for (const n of [0, 1]) $(`shape.${k}.${n}`).value = ss ? ss[k][n] : d[n];
  for (const [k, , , d] of SHAPE_INT) $(`shape.${k}`).value = ss ? ss[k] : d;
  $('shapemode').checked = !!ss; setShapeMode(); shapeHints();
  for (const sec of ['hull', 'material', 'gates', 'stability', 'objective']) for (const [k] of FIELDS[sec]) $(`${sec}.${k}`).value = p[sec][k];
  for (const [k] of FIELDS.search) for (let n = 0; n < 3; n++) $(`search.${k}.${n}`).value = p.search[k][n];
  $('cases').innerHTML = ''; for (const lc of p.load_case) lcBlock(lc);
}
// TOML from the form. Numbers are written so they always parse as TOML floats where params.rs wants f64.
const fl = v => { const n = Number(v); if (v === '' || !isFinite(n)) throw new Error('not a number: "' + v + '"'); return Number.isInteger(n) ? n.toFixed(1) : String(n); };
const list = s => s.split(',').map(x => x.trim()).filter(x => x !== '');
const tstr = s => JSON.stringify(s);
function formToml() {
  const g = id => $(id).value;
  const shape = $('shapemode').checked;
  const int = id => { const n = Number(g(id)); if (g(id) === '' || !Number.isInteger(n) || n < 0) throw new Error(id + ': not a whole number: "' + g(id) + '"'); return String(n); };
  const out = ['# generated by the JAGUAR web UI', '[hull]'];
  if (!shape) out.push(`file = ${tstr(g('hull.file'))}`);
  out.push(`stations = ${int('hull.stations')}`, `flare_deg = ${fl(g('hull.flare_deg'))}`, '');
  for (const d of $('cases').children) {
    out.push('[[load_case]]', `name = ${tstr(d.querySelector('.lcname').value)}`, `weights_lb = [${list(d.querySelector('.lcw').value).map(fl).join(', ')}]`);
    const seats = list(d.querySelector('.lcs').value);
    if (seats.length) out.push(`seats_in = [${seats.map(fl).join(', ')}]`);
    out.push('');
  }
  for (const sec of ['material', 'search', 'gates', 'stability', 'objective']) {
    out.push(`[${sec}]`);
    if (sec === 'material') out.push(`strength_model = ${tstr(g('material.strength_model'))}`);
    if (sec === 'material') out.push(`mix_data = ${tstr(g('material.mix_data'))}`);
    if (sec === 'objective') out.push(`kind = ${tstr(g('objective.kind'))}`);
    for (const [k] of FIELDS[sec]) out.push(sec === 'search' ? `${k} = [${[0, 1, 2].map(n => fl(g(`search.${k}.${n}`))).join(', ')}]` : `${k} = ${fl(g(`${sec}.${k}`))}`);
    out.push('');
  }
  out.push('[punching]', `method = ${tstr(g('punching.method'))}`, `knees = ${int('punching.knees')}`);
  for (const [k] of PUNCH) out.push(`${k} = ${fl(g('punching.' + k))}`);
  out.push('');
  if (shape) {
    out.push('[shape_search]');
    for (const [k] of SHAPE) out.push(`${k} = [${[0, 1].map(n => fl(g(`shape.${k}.${n}`))).join(', ')}]`);
    for (const [k] of SHAPE_INT) out.push(`${k} = ${int('shape.' + k)}`);
    out.push('');
  }
  return out.join('\n');
}
$('copy').onclick = () => navigator.clipboard && navigator.clipboard.writeText($('gen').value);

// ---------- 3D ----------
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
view.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f4f4);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 10000);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(1, 2, 1.5); scene.add(sun);
let canoe = null, water = null;
let theta = 0.8, phi = 1.1, radius = 400, target = new THREE.Vector3();
function placeCam() {
  camera.position.set(target.x + radius * Math.sin(phi) * Math.cos(theta), target.y + radius * Math.cos(phi), target.z + radius * Math.sin(phi) * Math.sin(theta));
  camera.lookAt(target);
}
let drag = null;
renderer.domElement.addEventListener('mousedown', e => drag = [e.clientX, e.clientY]);
window.addEventListener('mouseup', () => drag = null);
window.addEventListener('mousemove', e => {
  if (!drag) return;
  theta += (e.clientX - drag[0]) * 0.01;
  phi = Math.min(3.1, Math.max(0.05, phi - (e.clientY - drag[1]) * 0.01));
  drag = [e.clientX, e.clientY]; placeCam();
});
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); radius *= e.deltaY > 0 ? 1.1 : 0.9; placeCam(); }, { passive: false });
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  const c = $('plot'); c.width = c.clientWidth; c.height = c.clientHeight; drawPlot();

    ctx.fillText(`gunwale ${(2 * yb[yb.length - 1]).toFixed(1)} in`, cx, H - 5); ctx.textAlign = 'left';
  });
  legend(ctx, W - 300, 28, [['#963', 'hull wall'], ['#36f', 'loaded waterline']]);
}
function plotShape(ctx, W, H) {
  const sh = cands.filter(k => k.shape);
  if (!sh.length) return msg(ctx, W, H, 'run a shape search first (Hull: Optimize hull shape)');
  const score = k => objKind === 'drag' ? k.drag_n : k.hull_weight_lb;
  let best = Infinity; const bx = [], by = [];
  sh.forEach((k, i) => { if (k.passes && typeof score(k) === 'number' && score(k) < best) best = score(k); if (isFinite(best)) { bx.push(i + 1); by.push(best); } });
  const hw = (W - 40) / 2, r1 = { l: 70, t: 14, w: hw - 70, h: H - 50 }, r2 = { l: hw + 90, t: 14, w: hw - 70, h: H - 50 };
  const ul = objKind === 'drag' ? 'best drag, N' : 'best hull weight, lb';
  if (bx.length) { const a = axes(ctx, r1, [1, Math.max(2, sh.length)], range2(by), 'shape evaluation #', ul); line(ctx, a, bx, by, '#06c'); legend(ctx, r1.l + 8, r1.t + 14, [['#06c', 'best passing so far']]); }
  else { ctx.strokeRect(r1.l, r1.t, r1.w, r1.h); ctx.fillText('no passing shape yet', r1.l + 10, r1.t + 20); }
  const a2 = axes(ctx, r2, range2(sh.map(k => k.length_in)), range2(sh.map(k => k.beam_in)), 'length, in', 'beam, in');
  for (const k of sh) { ctx.fillStyle = !k.verdict ? '#d00' : k.passes ? '#1a1' : '#999'; ctx.beginPath(); ctx.arc(a2.px(k.length_in), a2.py(k.beam_in), 3, 0, 7); ctx.fill(); }
  const w = winC(); if (w) { ctx.strokeStyle = '#00c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(a2.px(w.length_in), a2.py(w.beam_in), 8, 0, 7); ctx.stroke(); ctx.lineWidth = 1; }
  ctx.fillStyle = '#000'; ctx.fillText('green = passes, grey = fails, red = error, ring = winner', r2.l + 6, r2.t + 14);
}

// ---------- winner box ----------
function checksTable(v) {
  if (!Array.isArray(v.checks) || !v.checks.length) return '<div class="warn">(no per-check breakdown in this result)</div>';
  const f = (x, n) => typeof x === 'number' ? x.toFixed(n) : '?';
  const rows = v.checks.map(k => `<tr class="${k.name === v.governing_check ? 'gov' : ''}"><td>${k.name}</td><td>${f(k.demand, 0)}</td><td>${f(k.capacity, 0)}</td>
    <td>${f(k.dc, 3)}</td><td><span class="bar" style="width:${Math.min(60, 60 * (k.dc || 0))}px;background:${k.dc > dcGate ? '#c33' : '#48c'}"></span></td></tr>`).join('');
  return `<table id="checks"><tr><th>check</th><th>demand psi</th><th>capacity psi</th><th>D/C</th><th></th></tr>${rows}</table>`;
}
function showWinner() {
  const box = $('winner');
  if (!result) { box.textContent = 'no result yet'; return; }
  const win = result.winner;
  if (!win) { box.innerHTML = '<span class="bad">NO DESIGN PASSES</span>'; return; }
  const c = win.candidate, v = c.verdict || {};
  const f = (x, n) => typeof x === 'number' ? x.toFixed(n) : '?';
  const sh = c.shape;
  const gmOk = typeof c.gm_in === 'number' && gmGate !== null ? (c.gm_in >= gmGate ? 'ok' : 'bad') : '';
  const shapeTbl = sh ? `<h4 style="margin:4px 0">Hull shape factors</h4><table>${SHAPE.map(([k, label, unit, t]) =>
    `<tr title="${esc(t)}"><td>${label}</td><td>${f(sh[k], unit === 'in' ? 1 : 3)}${unit === 'in' ? ' in (' + ftin(sh[k]) + ')' : ''}</td></tr>`).join('')}</table>` : '';
  box.innerHTML = `<table>
    <tr><td>length</td><td>${f(c.length_in, 1)} in (${typeof c.length_in === 'number' ? ftin(c.length_in) : '?'})</td></tr>
    <tr><td>beam</td><td>${f(c.beam_in, 1)} in</td></tr>
    ${sh ? `<tr><td>design draft</td><td>${f(sh.draft_in, 2)} in</td></tr>` : ''}
    <tr><td>GM (stability)</td><td class="${gmOk}">${typeof c.gm_in === 'number' ? f(c.gm_in, 2) + ' in' : 'not computed'} (gate &ge; ${f(gmGate, 2)} in)</td></tr>
    ${typeof c.drag_n === 'number' ? `<tr><td>drag</td><td>${f(c.drag_n, 1)} N</td></tr>` : ''}
    <tr><td>thickness</td><td>${f(c.thickness_in, 3)} in</td></tr>
    <tr><td>density</td><td>${f(c.density_pcf, 1)} pcf</td></tr>
    ${c.mix ? `<tr><td>mix</td><td>${esc(c.mix)}</td></tr>` : ''}
    <tr><td>side flare</td><td>${f(flareDeg(), 1)} deg</td></tr>
    <tr><td>depth</td><td>${f(c.depth_in, 2)} in</td></tr>
    <tr><td>hull weight</td><td>${f(c.hull_weight_lb, 1)} lb</td></tr>
    <tr><td>D/C (search)</td><td>${f(v.dc, 3)} (${c.governing_case || ''})</td></tr>
    <tr><td>D/C verify @${win.verify_stations}</td><td>${f(win.verify_dc, 3)}</td></tr>
    <tr><td>freeboard</td><td>${f(v.freeboard_in, 2)} in (gate &ge; ${f(fbGate, 2)} in)</td></tr>
    <tr><td>governing load case</td><td>${c.governing_case || '?'}</td></tr></table>
    ${checksTable(v)}
    <div class="${win.verified ? 'ok' : 'bad'}">${win.verified ? 'VERIFIED' : 'NOT VERIFIED'}</div>
    ${win.on_grid_edge ? '<div class="warn">Winner is on the search grid edge: widen the search range.</div>' : ''}
    ${win.at_mix_data_edge ? '<div class="warn">Density is the lightest mix the lab data supports; test lighter mixes to go lower.</div>' : ''}
    ${shapeTbl}`;
}

// ---------- API ----------
function setHull(h, label) { hull = h; hullLabel = label; $('viewlabel').textContent = label; buildCanoe(); }
async function loadHull(file) {
  if ($('shapemode') && $('shapemode').checked && !file) { $('viewlabel').textContent = 'shape search: hull appears after the run'; return; }
  const r = await fetch('/api/hull' + (file ? '?file=' + encodeURIComponent(file) : ''));
  if (r.ok) { const h = await r.json(); setHull(h, 'picked hull: ' + (h.name || file || '')); } else { $('err').textContent = 'hull: ' + (await r.json()).error; }
}
async function loadMix() {
  const r = await fetch('/api/mix'); const m = await r.json();
  if (!r.ok) { $('mix').innerHTML = `<span class="bad">${esc(m.error)}</span>`; return; }
  const f = (x, n) => typeof x === 'number' ? x.toFixed(n) : '?';
  $('mix').innerHTML = `<table><tr><th>mix</th><th>pcf</th><th>measured psi</th><th>fraction</th><th>final psi</th></tr>
    ${m.points.map(p => `<tr><td>${esc(p.mix)}</td><td>${f(p.density_pcf, 1)}</td><td>${f(p.measured_psi, 0)}</td><td>${f(p.fraction_of_final, 2)}</td><td>${f(p.final_psi, 0)}</td></tr>`).join('')}</table>
    <div title="Straight line through the final split tensile strengths. Flexural = this x flex/split ratio.">split tensile = ${f(m.split_slope_psi_per_pcf, 2)} x density ${m.split_intercept_psi < 0 ? '-' : '+'} ${f(Math.abs(m.split_intercept_psi), 1)} psi (rms error ${f(m.rms_residual_psi, 1)} psi)</div>
    <div>tested densities ${f(m.density_min_pcf, 1)} .. ${f(m.density_max_pcf, 1)} pcf</div>`;
}
async function loadResult() {
  const r = await fetch('/api/result');
  result = r.ok ? await r.json() : null;
  if (result) {
    cands = result.candidates;
    const p = result.params || {};
    if (p.gates) { dcGate = p.gates.dc_search; fbGate = p.gates.freeboard_min_in; }
    if (p.stability) gmGate = p.stability.gm_min_in;
    if (p.objective) objKind = p.objective.kind;
    if (result.winner_hull) {
      const wc = result.winner && result.winner.candidate;
      setHull(result.winner_hull, 'winner hull: ' + (result.winner_hull.name || '') + (wc ? ` at ${wc.depth_in.toFixed(1)} in depth` : ''));
    }
  }
  showWinner(); buildCanoe(); buildTabs(); drawPlot();
}
async function poll() {
  const r = await fetch('/api/status?since=' + cands.length);
  const s = await r.json();
  cands = cands.concat(s.candidates);
  $('status').textContent = `${s.state}: ${s.done} / ${s.total}` + (s.shape && s.state === 'running' ? `   shape ${s.shape.index + 1} / ${s.shape.shapes}` : '');
  $('prog').max = s.total || 1; $('prog').value = s.done;
  $('err').textContent = s.error || '';
  drawPlot();
  if (s.state === 'running') setTimeout(poll, 250);
  else { polling = false; $('run').disabled = false; if (s.state === 'done') loadResult(); }
}
$('run').onclick = async () => {
  let text;
  if ($('raw').open) text = $('toml').value;
  else {
    try { text = formToml(); } catch (e) { $('err').textContent = 'form: ' + e.message; return; }
    $('gen').value = text; $('gendet').open = true;
  }
  parseTomlBits(text);
  const r = await fetch('/api/run', { method: 'POST', body: text });
  if (r.status !== 202) { $('err').textContent = `run rejected (${r.status}): ` + ((await r.json()).error || ''); return; }
  $('err').textContent = ''; cands = []; result = null; showWinner(); drawPlot();
  $('run').disabled = true;
  await loadHull($('raw').open || $('shapemode').checked ? null : $('hull.file').value);
  loadMix();
  if (!polling) { polling = true; poll(); }
};
(async () => {
  const p = await (await fetch('/api/params')).json();
  $('toml').value = p.toml; parseTomlBits(p.toml);
  buildForm();
  const hulls = await (await fetch('/api/hulls')).json();
  fillForm(p.params, hulls);
  buildTabs(); resize();
  loadMix();
  await loadHull();
  await loadResult();
  const s = await (await fetch('/api/status')).json();
  if (s.state === 'running') { cands = []; polling = true; $('run').disabled = true; poll(); }
})();
</script>
</body>
