[project]
name = "canoe-optimizer"
version = "1.0.0"
description = "ASCE Concrete Canoe Engineering Suite"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long  (handled by formatter)
    "F401",   # imported but unused  (re-exports in shims)
    "E741",   # ambiguous variable name  (l, O in physics)
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = false
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
