[pytest]
# Add the project root to sys.path so `import config`, `import structural`,
# etc. resolve to the local modules — not any installed package with the
# same name.
pythonpath = .
testpaths = tests
addopts = -v
markers =
    invalid_lab_row(reason): this test deliberately builds a lab row production rejects; the reason is the audited artefact
    godzilla: live cross-check of the Python wave-resistance model against the
        Michlet/Godzilla Fortran engine (mlt933w.exe). Slow, and skips honestly
        wherever Godzilla cannot produce real drag data — it is an interactive
        Allegro GUI program with no headless batch resistance mode. Quick runs:
        `pytest -m "not godzilla"`.  Cross-check only: `pytest -m godzilla`.
