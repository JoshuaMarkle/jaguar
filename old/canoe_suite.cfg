# canoe_suite.cfg  —  generated by first-run wizard 2026-06-20
# Edit any value here; restart the app to pick up changes.
#
# EVERY KEY BELOW IS LIVE.  Each one is read at import by config/__init__.py,
# physics/constants.py or mix_database.py, and the matching UI field is SEEDED
# from it — so this file sets what the app starts from, and the tab you launch
# a run from overrides it for that run.  There is no longer any key here that
# is parsed and then ignored; if you add one, wire it and say where it is read.
# Audited and wired 2026-07-31.

setup_complete: true

structural:
  # -> config.FACTOR_OF_SAFETY / DYNAMIC_LOAD_FACTOR; the Structural tab's FoS
  # field is seeded from factor_of_safety and overrides it per run.
  factor_of_safety: 1.5
  # -> config.SWEEP_EXECUTOR.  "process" or "thread".
  #
  # Processes escape the GIL: measured >2x faster at EQUAL worker count on a
  # 41-station grid (209.7 s against 483.4/804.5 s), winner bit-identical --
  # fingerprint a6c0d54f over all 63 numeric leaves, 167.511799 lb.  Treat the
  # ratio as a direction, not a figure: identical thread runs spanned 1.67x.
  #
  # Each spawned child re-imports config FRESH and sees the defaults in this
  # file, so a run's settings reach it only through the fingerprinted RunState
  # in each task (config/run_state.py), which the worker verifies before doing
  # any physics.  A mismatch fails the task loudly rather than returning a
  # plausible weight for the wrong design.
  #
  # UNTESTED: spawn has only been validated on the unfrozen interpreter.  A
  # PyInstaller build re-executes the same exe per child; freeze_support() is
  # called first thing at both entry points, but no frozen build has been run.
  # Set back to "thread" if a packaged build misbehaves.
  # VERIFIED on both seating modes (see the commit for this line):
  #   fixed seating     -> winner a6c0d54f, 167.511799 lb
  #   optimised seating -> winner e7d1d862, 158.985398 lb, reproduced to six
  #                        decimals across two independent process runs
  # The optimised path exercises the 8-start SLSQP placement solve, which no
  # process run reached until then; it completed with zero worker errors.
  #
  # UNTESTED: a frozen PyInstaller build.  It re-executes this same exe per
  # spawned child; freeze_support() is called first thing at both entry points,
  # but no packaged build has been run.  Escape hatch is this line: set it back
  # to "thread" and nothing else changes.
  sweep_executor: process
  # -> config.SWEEP_MAX_WORKERS.  null = automatic: physical cores for
  # processes, 8 for threads.  Note the sweep also clamps to the task count,
  # so a 4-task grid uses 4 workers whatever is set here.
  sweep_max_workers: null
  dynamic_load_factor: 1.2
  # -> config.KUPFER_ACCEPTANCE_MAX; seeds the Structural tab's "Max accepted
  # D/C" field.  The Kupfer utilisation a winner must stay UNDER.  Not 1.0:
  # that utilisation drifts ~1-2% per station-count doubling with no observed
  # plateau out to 641 stations, so a design accepted at 1.0 on the 161-station
  # search grid fails one refinement step (measured: 0.9957 at 161 -> 1.0040 at
  # 321).  0.95 buys ~2.4 doublings at the worst observed drift, i.e. the
  # verdict holds to ~830 stations.  A NUMERICAL margin, not a safety factor --
  # factor_of_safety covers the physics and is applied separately.
  kupfer_acceptance_max: 0.95
  # -> config.KUPFER_DRIFT_PER_DOUBLING.  Growth of the governing Kupfer
  # utilisation per DOUBLING of the longitudinal station count.
  #
  # PROVENANCE — measured, not assumed.  Five designs on the live hull with the
  # real stem overhang, evaluated at 41/81/161/321/641 stations:
  #
  #     refinement step      mean drift    worst design
  #        41 ->  81            4.88%         11.39%
  #        81 -> 161            1.52%          4.13%
  #       161 -> 321            1.06%          2.19%
  #       321 -> 641            1.00%          2.88%
  #
  # The increments decay and then settle near ~1%; no plateau appears out to
  # 641 stations, which is why the acceptance margin exists at all.
  #
  # 0.0219 is the WORST drift observed at the production refinement step
  # (161 -> 321), not the mean.  The sweep gates its SEARCH at
  # kupfer_acceptance_max/(1+drift) = 0.95/1.0219 = 0.930, so a winner still
  # clears 0.95 when re-checked at double the resolution.  Using the worst
  # rather than the mean costs a little weight but stops an hour-long sweep
  # from failing its own verification gate at the very end.  Relax toward
  # 0.0106 (the mean) if lighter designs matter more than first-run success.
  kupfer_drift_per_doubling: 0.0219

  # ── Crew vertical CG [in above the keel] ────────────────────────────────
  # LIVE (config.CREW_VERTICAL_CG_IN).  Feeds the LOADED transverse stability
  # figure, and it dominates it: the ~640 lb crew outweighs the ~120 lb hull
  # about five to one, so this number, not the concrete distribution, largely
  # sets the combined KG that GM_T is measured from.
  #
  # It is an ASSUMPTION, not a measurement -- 12 in is a kneeling paddler's
  # torso/hip centroid over a shallow hull bottom.  The report prints loaded
  # GM_T at 10/12/14 in precisely so the sensitivity is visible rather than
  # implied.  Measure it before quoting a loaded GM_T as a result, and
  # especially before MIN_GMT_IN is ever raised above 0.
  crew_vertical_cg_in: 12.0

  # ── Design methodology ──────────────────────────────────────────────────
  # "LRFD" (default) or "ASD".  The FAILURE CRITERION is the Kupfer-Gerstle
  # biaxial envelope under BOTH -- LRFD/ASD change only how loads and
  # capacities are factored, never the criterion.
  #   ASD   nominal loads (D + L)                vs  f_n / omega_safety
  #   LRFD  factored (gamma_dead*D + gamma_live*L) vs  phi_resistance * f_n
  # ASD with omega_safety = factor_of_safety reproduces the pre-LRFD results.
  design_method: LRFD
  # ASCE 7-22 Sec. 2.3.1.  dynamic_load_factor multiplies the live load FIRST
  # (impact, not safety), so the effective factor on nominal crew weight is
  # dynamic_load_factor * gamma_live = 1.2 * 1.6 = 1.92.
  gamma_dead: 1.2
  gamma_live: 1.6
  # Per-case overrides: case_name: [gamma_dead, gamma_live].  Unlisted cases
  # use the globals above.  Names: race_4, race_2, race_3.
  #   load_factors_by_case:
  #     race_4: [1.3, 1.7]
  load_factors_by_case: {}
  # LRFD resistance factor.  0.60, NOT ACI's 0.90: that value is for
  # tension-controlled REINFORCED sections, where steel carries the tension and
  # the concrete's tensile strength is ignored.  This gate checks concrete
  # TENSION directly, which is the plain-concrete limit state -- ACI 318-19
  # Table 21.2.1(g) / Ch. 14 give 0.60 (ACI 318-11 Sec. 9.3.5 used 0.55).  The
  # hull's mesh is not conventional reinforcement and contributes nothing
  # before the first cracking this check gates on.
  phi_resistance: 0.60
  # ASD factor of safety.  Kept equal to factor_of_safety so ASD is a
  # regression baseline for the pre-LRFD engine.
  omega_safety: 1.5
  # -> config.MANEUVER_COUPLING_K, read by the lateral-load model and both
  # report generators.  No UI field; this file is the only place it is set.
  maneuver_coupling_k: 0.5
  # Design turn for the transverse-hoop / lateral checks (M_lat ~ v^2 / R).
  # 4.0 m is a realistic minimum slalom radius for a ~6.1 m hull; 3.0 m was
  # effectively a pivot-turn at speed and inflated hoop demand at the tips.
  maneuver_speed_mps: 2.5
  maneuver_turn_radius_m: 4.0
  # -> config.THICKNESS_MIN_IN / THICKNESS_MAX_IN, which seed the Structural
  # tab's Min/Max wall-thickness fields.  Only the MIN and MAX of this list are
  # used: the sweep searches the buildable 1/32" + 0.5 mm grid between them, so
  # the intermediate entries are ignored by design.
  thickness_options_in: [0.375, 0.5, 0.625, 0.75]
  # -> config.FREEBOARD_MIN_IN; seeds the Structural tab's freeboard field.
  freeboard_min_in: 6.0
  # Through-thickness construction layers: the wall is troweled up in this many
  # equal passes of the same mix (default 3 -> 0.375" wall = 3 x 0.125").  A
  # DERIVED manufacturing descriptor only -- orthogonal to the pour zones and
  # the mix count, and never an input to the sweep (winner is independent of it).
  n_construction_layers: 3
  # STEM OVERHANG / tip cantilever extent (inches per end): the fore-aft run at
  # each end where the hull is too narrow to host a shell section
  # (max half-breadth < 1.5 * wall thickness).  Structurally it is un-buoyed
  # cantilever mass beyond the supported span; in the CAD export the same
  # length sets the stem sweep, over which the keel line rises to the sheer.
  #
  # "auto" DERIVES it from the hull geometry, by interpolating where the
  # half-breadth crosses 1.5t -- so the answer is fixed by the hull, not by how
  # many rows the offset file happens to have.  On the current hull that is
  # ~1.05 in/end.  A number here is an explicit user ASSUMPTION instead;
  # 0 = no overhang (vertical stem ends).
  #
  # Named "bow_stern_rocker_in" until 2026-08-02.  That name was doubly wrong:
  # "rocker" means the keel's VERTICAL rise in naval architecture whereas both
  # models use a HORIZONTAL distance, and the old auto rule returned
  # 0.03 * LOA = 7.20 in/end -- a CAD-visibility floor, ~7x the real geometry --
  # which fed the structural cantilever and quietly relieved midship sagging.
  # The old key is still accepted on load.
  stem_overhang_in: auto

crew:
  # -> config.RACE_4/2/3_PERSON; seed the Structural tab's per-case crew
  # weight fields, which override them per run.
  # race_4/2/3_person_lbs are RETIRED and deliberately absent.  They were keyed
  # by crew SIZE, which cannot express 2M and 2F as different crews; weights now
  # live per category in race_categories below.  The loader still accepts them
  # from an older file as a seed for any category that omits its own
  # weights_lb, so existing configs keep working -- but leaving them here would
  # be a key that is parsed and then overridden, which is exactly the dead-key
  # pattern this file forbids.
  # -> config.PADDLER_POWER_W; seeds the Race tab's "Watts/paddler" field,
  # which sets canoe_physics.PADDLER_POWER_W per run.  Sustained, per paddler:
  # 100 W recreational, 150 W trained club, 200 W competitive.
  paddler_power_w: 150.0
  # Kneeling contact for the punching check: paddlers are lifted and placed
  # onto BOTH knees, so the load lands on two circular patches.
  knee_dia_in: 3.0
  knee_spacing_in: 8.0        # centre-to-centre
  knee_load_split: 0.5        # fraction of total on the worst knee
  knee_pad_in: 0.0            # design pad thickness; ASCE legal cap is 0.5
  # Knee/toe load split, applied only when ADVANCED_PADDLER_LOADING is on.
  #
  # BOTH BASES ARE NOW 1.00 (100/0 -- all load on the knees, no toe relief).
  # They were deliberately different once; that is no longer true, and the
  # reason is recorded here so nobody re-derives it:
  #   0.80/0.20  UNSOURCED.  Carried from the initial commit with no
  #              measurement behind it.  Retired 2026-08-28.
  #   0.90/0.10  team-MEASURED but n = 1 paddler (knee_frac_measured_n), and
  #              it drifts with posture and fatigue -- the same paddler
  #              heels-sitting vs upright-kneeling spans ~68% to ~100%.
  #   1.00/0.00  ADOPTED.  Needs no measurement, cannot drift with posture,
  #              already the punching basis, and costs ~1% of hull weight.
  # Raising bending to 1.00 makes it EQUAL to punching; if a future
  # measurement justifies toe relief, lower bending only, never punching.
  knee_frac_bending: 1.00
  knee_frac_punching: 1.00
  toe_offset_in: 17.0
  knee_frac_measured_n: 1     # paddlers measured so far

  # ── Race categories: per-seat sex and stature ───────────────────────────
  # LIVE (config.RACE_CATEGORIES).  The FIVE ASCE 2026 races.  Sex selects the
  # sex-specific segment mass fractions and stature scales every segment length
  # in physics/biomechanics.py, which computes the crew CG that sets loaded
  # GM_T.  Validated on load: each category must carry exactly as many sexes and
  # heights as its name implies, and 4_coed must be 2 male + 2 female.
  #
  # WEIGHTS LIVE HERE, per category -- this block is the single source of truth
  # for crew composition.  The race_*_person_lbs lists above are keyed by crew
  # SIZE and so cannot express 2M and 2F as different crews; they are kept only
  # as a legacy seed for a category that omits its own weights_lb, and
  # config.RACE_*_PERSON are derived aliases (RACE_2/3_PERSON resolve to the
  # HEAVIER of the two same-size crews).  Nothing should read them directly.
  #
  # All five races run as separate load cases in the bending envelope, and the
  # freeboard ceiling uses the COMPUTED heaviest crew rather than assuming the
  # four is heaviest.
  #
  # Seating ARRANGEMENT is deliberately absent from crew KG: a mass-weighted
  # mean cannot depend on order.  Arrangement DOES move the bending envelope
  # (measured: 40% on hogging), and the envelope takes a per-station max over
  # arrangements rather than trusting the order written here.
  # SEAT PINS: one entry per paddler, giving the 1-based seat (bow -> stern)
  # that paddler must occupy; null = "any".  Example, pinning a steersman to the
  # stern seat and a stroke to the bow:
  #     "4_coed": {..., seat_pins: [1, null, null, 4]}
  #
  # READ THIS BEFORE PINNING.  Pins REDUCE the set of seat orderings the
  # envelope is taken over, which makes the design LESS CONSERVATIVE.  A pinned
  # analysis is valid ONLY for arrangements consistent with the pins -- if the
  # crew swaps seats on race day outside that set, the analysis does not cover
  # it.  The report states, per category, which seats were pinned and how many
  # orderings were evaluated out of how many the crew could physically produce,
  # and carries it as a BINDING compliance note.
  #
  # Validated on load: a pin outside 1..n, two paddlers pinned to one seat, or
  # a pin list the wrong length all raise rather than being ignored.
  race_categories:
    "2M":     {sexes: [M, M],       heights_in: [70.0, 70.0],
               weights_lb: [175.0, 165.0], seat_pins: [null, null]}
    "2F":     {sexes: [F, F],       heights_in: [65.0, 65.0],
               weights_lb: [145.0, 135.0], seat_pins: [null, null]}
    "3M":     {sexes: [M, M, M],    heights_in: [70.0, 70.0, 70.0],
               weights_lb: [175.0, 170.0, 165.0],
               seat_pins: [null, null, null]}
    "3F":     {sexes: [F, F, F],    heights_in: [65.0, 65.0, 65.0],
               weights_lb: [145.0, 140.0, 135.0],
               seat_pins: [null, null, null]}
    "4_coed": {sexes: [M, M, F, F], heights_in: [70.0, 70.0, 65.0, 65.0],
               weights_lb: [175.0, 165.0, 145.0, 135.0],
               seat_pins: [null, null, null, null]}

  # ── Kneeling posture ────────────────────────────────────────────────────
  # LIVE (config.KNEEL_POSTURE / KNEEL_HIP_HEIGHT_IN / TORSO_ANGLE_DEG).
  #
  # POSTURE DOMINATES THE STABILITY RESULT.  The two kneels differ by ~8 in of
  # hip height, while sweeping the torso angle across its entire plausible range
  # moves the crew CG only ~2 in:
  #   A_heels_sitting   hips resting back on the heels (seiza), hip ~0.10*H
  #   B_upright_kneel   hips off the heels, thighs near vertical, hip ~0.245*H
  #
  # B is the default because the team's own measurement supports it: at
  # knee_frac_bending 0.90 with toe_offset_in 17.0, horizontal equilibrium about
  # the knee puts the CG within ~1.3 in of the knee (an upright kneel).  Heels-
  # sitting would put ~68% of the load on the toes, which is not what was
  # weighed.  n = 1 paddler.
  kneel_posture: B_upright_kneel
  # MEASURED hip-joint height above the hull floor [in].  null = use the posture
  # preset above.  THIS IS THE NUMBER WORTH MEASURING: one tape measure on a
  # kneeling paddler supersedes the whole anthropometric estimate.
  kneel_hip_height_in: null
  # Torso angle from HORIZONTAL [deg]; 90 = upright.  Degrees here, converted to
  # radians at the call site.  Secondary to hip height.
  torso_angle_deg: 70.0

mix:
  # -> config.MIN_DENSITY_PCF / MAX_DENSITY_PCF.  The Structural tab's
  # "Min Mix (pcf)" and "Max Mix (pcf)" fields start from these and override
  # them per run.
  # min_density_pcf is the team's MANUFACTURING floor ("we will not batch
  # below this"), and it BOUNDS THE SWEEP -- it used to be documentation only.
  # It can raise, never lower, the Mix Lab regression's own viability floor
  # (the lightest mix it still predicts strength for, currently 57.5 pcf):
  # below that the regression predicts nothing, so those densities are configs
  # built, evaluated and rejected.  Whichever floor is higher wins, and the
  # Structural tab's range note says which one it was.
  min_density_pcf: 60.0
  max_density_pcf: 80.0
  # -> MixDatabase._configured_db_path().  Used ONLY if the file exists;
  # otherwise the project's own concrete_mixes.db is opened instead, so a stale
  # absolute path from another machine cannot silently hide the team's mix data.
  # Leave blank to always use the repo copy.
  db_path: "c:/Users/epy2rz/OneDrive - University of Virginia/Documents/Clubs/Concreate Canoe/2026-2027/Structural Analysis/Canoe_Optimizer/concrete_mixes.db"

  # -> MixDatabase regression training.  Breaks younger than this are logged
  # and shown in the Lab Results table, but held OUT of the density->strength
  # fit: a 7-day cylinder is the same mix at a fraction of its strength, so
  # averaging it in drags the fit down and makes every mix look too weak.
  # The Lab Results table's "In fit" column says which rows were used.
  design_age_days: 28
  # -> which measured density the regression uses when a specimen has both a
  # dry and a wet weight ("dry" or "wet").  The other is still recorded.
  # Wet runs a few pcf heavier (absorbed water), so mixing bases scatters the
  # fit; dry is the mix's own density.
  density_basis: dry

  # -> data/lab_csv.py.  Specimen geometry for the lab-results CSV import,
  # which fills in the cells the team's spreadsheet leaves to a formula:
  #   density [pcf] = weight [lb] / volume [ft^3]
  #   f_r [psi]     = P*L / (b*d^2)      (ASTM C78, third-point loading)
  # A CSV carrying its own labelled constants ("Cylinder Volume", "Length",
  # "Base", "Depth") overrides these for that file -- it records the specimen
  # that was actually broken.
  cylinder_volume_ft3: 0.058148148    # 4 x 8 in cylinder
  cube_volume_ft3: 0.00462963         # 2 in cube
  beam_volume_ft3: 0.008463542        # 6.5 x 1.5 x 1.5 in flexure prism
  flexure_span_in: 4.75
  flexure_base_in: 1.5
  flexure_depth_in: 1.5

water:
  # -> physics/constants.py WATER_RHO / NU, which every hydrodynamics module
  # reads.  Freshwater at 15 C; set to the venue's measured values if known.
  rho_kg_m3: 998.0
  nu_m2_s: 1.139e-6
