name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Lint with ruff
        # structural is a MODULE (structural.py), not a package — the old
        # `structural/` arg raised E902 (path not found) and aborted the lint.
        # Select/ignore rules come from [tool.ruff.lint] in pyproject.toml so
        # CI matches local `ruff check`; passing --ignore on the CLI used to
        # override (not extend) that config, silently dropping the project's
        # documented F401 (shim re-exports) and E741 (l, O in physics) ignores.
        run: ruff check physics/ structural.py structural_uncertainty.py services/ domain/

      - name: Type-check core packages
        run: |
          mypy physics/ structural.py structural_uncertainty.py services/ domain/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --disable-error-code=import-untyped
        continue-on-error: true   # advisory only until type stubs land

      - name: Run tests
        run: python -m pytest tests/ -x -q
        env:
          # Suppress Qt display errors in headless CI
          QT_QPA_PLATFORM: offscreen
