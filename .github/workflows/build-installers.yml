# Build distributable JAGUAR bundles for Windows and macOS.
#
# Triggers: manual (Actions tab → "Run workflow") or pushing a v* tag.
# Downloads: Actions run page → Artifacts (JAGUAR-windows / JAGUAR-macos).
#
# macOS note: PyInstaller cannot cross-compile, so the Mac build MUST run
# on a macOS runner — that is exactly what this workflow provides.  The
# Godzilla solver (mlt933w.exe) is Windows-only and is not bundled on
# macOS; every other feature works there.

name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: JAGUAR-windows
            bundle: dist/JAGUAR
          - os: macos-latest
            artifact: JAGUAR-macos
            bundle: dist/JAGUAR.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build bundle
        run: pyinstaller packaging/jaguar.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
