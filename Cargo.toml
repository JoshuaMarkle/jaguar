[package]
name = "jaguar"
version = "0.5.6"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
toml = "1.1.8"

# jaguar-wasm: the phone app's engine (docs/SPEC.md "Phone app"). The root package stays the
# core and the desktop app; `cargo build` / `cargo test` here build only it.
[workspace]
members = [".", "jaguar-wasm"]
