# canoe.toml: the team's settings, the starter for the JAGUAR desktop app (Documents/JAGUAR).
# Units: in, lb, psi, pcf. Unknown keys are an error. Edit it in the web UI (hover a label for
# help); every key is explained in the example canoe.toml and docs/SPEC.md of the source.
# Hull shape search ([shape_search], no hull.file): 4000 samples take ~12 min on a recent laptop; 96 ~1 min.
# off1_hull.json (the examples' hull) is too small for the 2M, 2F crew: it sinks.
[hull]
stations = 161
flare_deg = 3.0
stem_radius_in = 2.0
gunwale_max_flare_deg = 30.0
doubly_symmetric = true

[[load_case]]
name = "2M"
weights_lb = [175.0, 195.0]

[[load_case]]
name = "2M, 1F"
weights_lb = [175.0, 175.0, 195.0]

[[load_case]]
name = "2M, 2F"
weights_lb = [195.0, 175.0, 145.0, 145.0]

[[load_case]]
name = "2F"
weights_lb = [145.0, 145.0]

[[load_case]]
name = "1M, 1F"
weights_lb = [175.0, 145.0]

[material]
strength_model = "tested_mixes"
mix_data = "mix_tests.csv"   # lab breaks, in this folder
flex_over_split = 1.0
density_extrapolation_pcf = 4.0
method = "lrfd"
lrfd_dead = 1.2
lrfd_dead_only = 1.4
lrfd_live = 1.5
factor_of_safety = 1.5
dynamic_load_factor = 1.0
knee_patch_in = 3.0

[search]
thickness_in = [0.375, 0.5, 0.125]
density_pcf = [50.0, 80.0, 1.0]
depth_in = [10.0, 18.0, 0.5]

[gates]
dc_search = 0.97
dc_verify = 0.99
freeboard_min_in = 6.2
thickness_min_buildable_in = 0.375

[stability]
crew_cg_in = 12.0
gm_min_in = 3.0
gm_empty_min_in = 10.0

[objective]
kind = "race"
speed_mps = 3.0
straight_weight = 1.0
turn_radius_in = 600.0

# One condition per load case the races use, at the share of the score its races carry
# (Symposium and Finals 50% each: 4 Symposium races x 12.5%, 5 Finals races x 10%).
[[objective.displacements]]
load_case = "2M, 2F"
weight = 0.325

[[objective.displacements]]
load_case = "2M"
weight = 0.225

[[objective.displacements]]
load_case = "2F"
weight = 0.225

[[objective.displacements]]
load_case = "1M, 1F"
weight = 0.125

[[objective.displacements]]
load_case = "2M, 1F"
weight = 0.1

[punching]
method = "aci_22_6"
knees = 2
knee_split = 0.5
knee_spacing_in = 8.0
pad_in = 0.0
layers = 3
mesh_after_layer = [1, 2]
mold = "male"

[shape_search]
length_in = [180.0, 216.0]
beam_in = [18.0, 32.0]
draft_in = [2.0, 8.0]
fore_wp = [0.1, 1.6]
section = [0.1, 0.8]
fore_rocker = [0.0, 0.6]
aft_wp = [0.3, 1.6]
aft_rocker = [0.0, 0.6]
fore_len_frac = [0.3, 0.5]
aft_len_frac = [0.3, 0.5]
draft_step_in = 0.5
symmetric = true
samples = 4000
refine_rounds = 25
seed = 1

[flotation]
air_pocket_max_in = 36.0
swamp_factor = 1.2

[seats]
auto = true
spacing_min_in = 30.0
bow_clear_in = 18.0
stern_clear_in = 18.0
variance_in = 6.0

[race]
paddler_power_w = 100.0
propulsive_efficiency = 0.7
max_thrust_n = 100.0
buoy_clearance_m = 0.6
lane_width_m = 15.0
min_turn_radius_m = 2.0

